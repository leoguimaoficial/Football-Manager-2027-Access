name: Validate and prepare
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/companion/package-lock.json
      - name: Game-independent regression and production profile
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Installer transaction, network and discovery tests
        run: dotnet test installer/FM27Access.Installer.Tests -c Release --logger trx --results-directory artifacts/installer-tests
      - name: Companion JavaScript tests
        shell: pwsh
        run: |
          npm ci --prefix tests/companion
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm --prefix tests/companion run test:unit
          if ($LASTEXITCODE -ne 0) { throw 'Companion unit tests failed' }
          node --test tests/distribution/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Distribution/documentation checks failed' }
          npx --prefix tests/companion playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser install failed' }
          node tests/distribution/guide-browser.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Guide browser/axe checks failed' }
      - name: Publish installer and Companion
        shell: pwsh
        run: |
          ./installer/build-installer.ps1
          dotnet publish FM27Access.CompanionApp -c Release -p:FM27DeveloperTools=false -o artifacts/companion
          if ($LASTEXITCODE -ne 0) { throw 'Companion publish failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/installer/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/**/*.trx
          retention-days: 30
  distribution:
    # Private compiler inputs are available to trusted main builds only.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve pinned private input
        id: references
        shell: pwsh
        run: |
          $pin = Get-Content packaging/build-references.json -Raw | ConvertFrom-Json
          if ($pin.commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid private compiler input commit.' }
          "commit=$($pin.commit)" >> $env:GITHUB_OUTPUT
      - name: Read private compiler input
        uses: actions/checkout@v4
        with:
          repository: leoguimaoficial/FM27Access-Build-References
          ref: ${{ steps.references.outputs.commit }}
          path: .build-references
          ssh-key: ${{ secrets.FM27_BUILD_REFERENCES_SSH_KEY }}
          persist-credentials: false
      - name: Restore and verify private references
        shell: pwsh
        env:
          INPUT_PATH: ${{ runner.temp }}/fm27-compiler-input
        run: ./scripts/Restore-BuildReferences.ps1 -InputPath .build-references -Destination $env:INPUT_PATH
      - name: Build exact checkout on GitHub
        shell: pwsh
        env:
          INPUT_PATH: ${{ runner.temp }}/fm27-compiler-input
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          ./scripts/package-distribution.ps1 -BuildReferencesPath $env:INPUT_PATH -OutputPath "artifacts/distribution-$env:BUILD_RUN_ID" -RunId $env:BUILD_RUN_ID -Commit $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed.' }
          $info = Get-Content "artifacts/distribution-$env:BUILD_RUN_ID/build-info.json" -Raw | ConvertFrom-Json
          @("## Verified FM27 Access build", "", "Version: $($info.version)", "", "Run ID: $env:BUILD_RUN_ID", "", "Commit: $env:SOURCE_SHA", "", "Select this run in **Publish selected verified build** to approve publication of these exact artifacts.") >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/distribution-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
